<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LEVELUP</title>
<style>
:root{--bg-color:#1a1025;--card-bg:#2d1b4e;--accent:#c77dff;--text-main:#f0e6ff;--xp-bar:#ff9e00;--danger:#ff4d4d;--success:#00e676;}
body{margin:0;padding:0;background:linear-gradient(180deg,#2b1055 0%,#1a1025 100%);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-bottom:80px;}
.app-container{width:100%;max-width:400px;padding:15px;box-sizing:border-box;}
h1{text-align:center;color:#ffb703;font-size:22px;letter-spacing:2px;text-shadow:0 0 10px rgba(255,183,3,0.5);margin-bottom:20px;}
h2{font-size:16px;margin-bottom:10px;color:#b39ddb;text-transform:uppercase;letter-spacing:1px;}
.card{background:var(--card-bg);border-radius:15px;padding:15px;margin-bottom:15px;border:1px solid rgba(199,125,255,0.3);box-shadow:0 4px 15px rgba(0,0,0,0.5);}
.profile-header{display:flex;align-items:center;gap:15px;border-bottom:1px solid rgba(199,125,255,0.3);padding-bottom:15px;margin-bottom:15px;position:relative;border-radius:10px;transition:0.3s;padding:10px;}
.profile-bg-fire{background:linear-gradient(45deg,rgba(255,77,77,0.2),transparent);box-shadow:0 0 20px rgba(255,77,77,0.4);border:1px solid #ff4d4d;}
.profile-bg-royal{background:linear-gradient(45deg,rgba(255,183,3,0.2),transparent);box-shadow:0 0 20px rgba(255,183,3,0.4);border:1px solid #ffb703;}
.profile-bg-void{background:linear-gradient(45deg,rgba(199,125,255,0.3),transparent);box-shadow:0 0 20px rgba(199,125,255,0.5);border:1px solid #c77dff;}
.avatar-box{width:70px;height:70px;background:#110a1a;border:2px solid var(--accent);border-radius:15px;display:flex;justify-content:center;align-items:center;font-size:35px;flex-shrink:0;}
.rank-badge{font-weight:bold;padding:5px 12px;border-radius:5px;font-size:20px;margin-left:auto;align-self:flex-start;transition:0.3s;}
.rank-f,.rank-e,.rank-d{background:#c77dff;color:#1a1025;box-shadow:0 0 10px #c77dff;}
.rank-c,.rank-b,.rank-a{background:#00b0ff;color:#1a1025;box-shadow:0 0 15px #00b0ff;}
.rank-s,.rank-ss{background:#ffb703;color:#1a1025;box-shadow:0 0 20px #ffb703;text-shadow:0 0 5px rgba(255,255,255,0.5);}
.rank-sss{background:#000;color:#ff4d4d;border:1px solid #ff4d4d;box-shadow:0 0 25px #ff4d4d, inset 0 0 10px #ff4d4d;text-shadow:0 0 8px #ff4d4d;}
.xp-bar-container{background:#110a1a;height:12px;border-radius:6px;overflow:hidden;margin-top:8px;border:1px solid #3a2561;}
.xp-bar-fill{background:var(--xp-bar);height:100%;width:0%;transition:width 0.3s;box-shadow:0 0 10px var(--xp-bar);}
.exercise-card{background:rgba(0,0,0,0.25);padding:12px;border-radius:10px;margin-bottom:12px;border-left:3px solid var(--accent);}
.exercise-top{display:flex;justify-content:space-between;margin-bottom:8px;}
.exercise-name{font-weight:bold;font-size:15px;}
.exercise-xp{font-size:12px;color:#b39ddb;}
.current-stat{font-weight:bold;color:var(--xp-bar);font-size:16px;}
.input-group{display:flex;gap:6px;width:100%;box-sizing:border-box;}
.input-group input{flex:1;min-width:0;background:#110a1a;border:1px solid #3a2561;color:white;padding:10px;border-radius:8px;font-size:16px;text-align:center;outline:none;box-sizing:border-box;}
.input-group input:focus{border-color:var(--accent);}
.btn-add{background:var(--accent);color:#1a1025;border:none;padding:0 15px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.btn-undo{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:0 12px;border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0;font-weight:bold;}
.path-group{margin-bottom:10px;border-radius:10px;overflow:hidden;border:1px solid #3a2561;}
.path-header{padding:12px 15px;background:rgba(0,0,0,0.4);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:14px;}
.path-content{display:none;padding:10px;background:rgba(0,0,0,0.1);}
.path-content.active{display:block;}
.boss-card{background:rgba(0,0,0,0.25);padding:12px;border-radius:8px;margin-bottom:10px;border-left:3px solid #ccc;}
.boss-card.defeated{opacity:0.5;filter:grayscale(1);}
.boss-card.locked{opacity:0.6;filter:grayscale(0.8);}
.boss-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.boss-name{font-weight:bold;font-size:15px;}
.boss-req{font-size:14px;color:#fff;margin:5px 0;font-weight:bold;}
.boss-progress{font-size:12px;color:#b39ddb;}
.boss-reward{font-size:12px;color:var(--xp-bar);font-weight:bold;}
.quest-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.quest-btn{background:rgba(0,0,0,0.3);border:1px solid var(--accent);color:white;padding:15px 10px;border-radius:10px;cursor:pointer;font-weight:bold;text-align:center;}
.quest-btn:disabled{opacity:0.3;cursor:not-allowed;}
.quest-card{background:rgba(0,0,0,0.25);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #3a2561;display:flex;flex-direction:column;gap:8px;}
.quest-card.completed{border-color:var(--success);}
.quest-title{font-weight:bold;font-size:14px;color:#ffb703;}
.quest-desc{font-size:12px;color:#b39ddb;}
.quest-reward{font-size:12px;color:var(--xp-bar);font-weight:bold;}
.btn-claim{background:var(--success);color:#1a1025;border:none;padding:8px;border-radius:5px;font-weight:bold;cursor:pointer;width:100%;}
.btn-claim:disabled{background:#555;color:#888;cursor:not-allowed;}
.shop-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.3);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #3a2561;}
.shop-item-info{display:flex;flex-direction:column;gap:4px;}
.shop-title{font-weight:bold;font-size:14px;}
.shop-price{color:var(--xp-bar);font-weight:bold;font-size:13px;}
.btn-buy{background:var(--xp-bar);color:#1a1025;border:none;padding:8px 15px;border-radius:8px;font-weight:bold;cursor:pointer;}
.btn-buy:disabled{background:#555;color:#888;}
.btn-buy.owned{background:var(--success);}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;background:rgba(26,16,37,0.95);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:10px 0 20px 0;border-top:1px solid rgba(199,125,255,0.3);z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#777;font-size:11px;cursor:pointer;transition:0.2s;}
.nav-item.active{color:var(--xp-bar);text-shadow:0 0 10px rgba(255,158,0,0.5);}
.nav-icon{font-size:20px;margin-bottom:3px;}
.screen{display:none;width:100%;}
.screen.active{display:block;animation:fadeIn 0.3s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
#character-creation{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px;box-sizing:border-box;position:fixed;top:0;left:0;width:100%;background:linear-gradient(180deg,#2b1055 0%,#1a1025 100%);z-index:200;}
#character-creation input{width:100%;max-width:300px;padding:15px;font-size:18px;border-radius:10px;border:2px solid var(--accent);background:rgba(0,0,0,0.5);color:white;margin-bottom:20px;text-align:center;outline:none;}
#character-creation button{padding:15px 40px;font-size:18px;background:var(--xp-bar);border:none;border-radius:10px;font-weight:bold;cursor:pointer;color:#1a1025;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="character-creation"><h1>СОЗДАНИЕ ОХОТНИКА</h1><p>Введи свое имя:</p><input type="text" id="player-name-input" placeholder="Твой ник..." maxlength="15"><button onclick="createCharacter()">НАЧАТЬ ПУТЬ</button></div>
<div class="app-container hidden" id="main-app">
<h1>LEVELUP</h1>
<div id="screen-profile" class="screen active">
<div class="card">
<div class="profile-header" id="profile-header-block"><div class="avatar-box" id="avatar-display">👤</div><div><div style="font-size:11px;color:#b39ddb;">ОХОТНИК</div><div id="display-name" style="font-size:18px;font-weight:bold;">DADAR</div><div style="font-size:13px;margin-top:3px;">Уровень <span id="display-level" style="color:var(--xp-bar);font-weight:bold;">1</span></div></div><div class="rank-badge rank-f" id="display-rank">F</div></div>
<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;"><span>Прогресс</span><span id="display-xp-text">0 / 100 XP</span></div><div class="xp-bar-container"><div class="xp-bar-fill" id="xp-bar-fill"></div></div></div>
<div style="margin-top:15px;font-size:16px;background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;text-align:center;">🌑 Тени: <span id="display-shadows" style="color:var(--xp-bar);">0</span></div>
</div>
<div class="card"><h2>Тренировка</h2>
<div class="exercise-card"><div class="exercise-top"><div><div class="exercise-name">💪 Отжимания</div><div class="exercise-xp">2 XP</div></div><div class="current-stat" id="stat-pushups">0</div></div><div class="input-group"><input type="number" id="input-pushups" placeholder="Сколько?"><button class="btn-add" onclick="addStat('pushups')">Добавить</button><button class="btn-undo" onclick="undoStat('pushups')">-</button></div></div>
<div class="exercise-card"><div class="exercise-top"><div><div class="exercise-name">🧗 Подтягивания</div><div class="exercise-xp">5 XP</div></div><div class="current-stat" id="stat-pullups">0</div></div><div class="input-group"><input type="number" id="input-pullups" placeholder="Сколько?"><button class="btn-add" onclick="addStat('pullups')">Добавить</button><button class="btn-undo" onclick="undoStat('pullups')">-</button></div></div>
<div class="exercise-card"><div class="exercise-top"><div><div class="exercise-name">🦵 Приседания</div><div class="exercise-xp">1.5 XP</div></div><div class="current-stat" id="stat-squats">0</div></div><div class="input-group"><input type="number" id="input-squats" placeholder="Сколько?"><button class="btn-add" onclick="addStat('squats')">Добавить</button><button class="btn-undo" onclick="undoStat('squats')">-</button></div></div>
<div class="exercise-card"><div class="exercise-top"><div><div class="exercise-name">👟 Шаги</div><div class="exercise-xp">0.03 XP</div></div><div class="current-stat" id="stat-steps">0</div></div><div class="input-group"><input type="number" id="input-steps" placeholder="Сколько?"><button class="btn-add" onclick="addStat('steps')">Добавить</button><button class="btn-undo" onclick="undoStat('steps')">-</button></div></div>
</div>
<button onclick="resetGame()" style="background:transparent; color:var(--danger); border:1px solid var(--danger); padding:10px; border-radius:10px; width:100%; margin-top:10px; cursor:pointer; font-weight:bold;">Сбросить весь прогресс</button>
</div>
<div id="screen-bosses" class="screen"><div class="card"><h2>Боссы Стихий</h2><div id="boss-paths"></div></div></div>
<div id="screen-quests" class="screen"><div class="card"><h2>Задания на день</h2><div id="quest-container"></div></div></div>
<div id="screen-shop" class="screen"><div class="card"><h2>Магазин</h2><div style="text-align:center;margin-bottom:15px;">Тени: <span id="shop-shadows" style="color:var(--xp-bar);">0</span></div><div id="shop-list"></div></div></div>
</div>
<div class="bottom-nav hidden" id="bottom-nav">
<div class="nav-item active" onclick="switchScreen('profile')" id="nav-profile"><div class="nav-icon">👤</div><div>Профиль</div></div>
<div class="nav-item" onclick="switchScreen('bosses')" id="nav-bosses"><div class="nav-icon">👹</div><div>Боссы</div></div>
<div class="nav-item" onclick="switchScreen('quests')" id="nav-quests"><div class="nav-icon">📜</div><div>Квесты</div></div>
<div class="nav-item" onclick="switchScreen('shop')" id="nav-shop"><div class="nav-icon">🛒</div><div>Магазин</div></div>
</div>
<script>
const XP_RATES={pushups:2,pullups:5,squats:1.5,steps:0.03};
const NAMES={pushups:"Отжимания",pullups:"Подтягивания",squats:"Приседания",steps:"Шаги"};
const ELEMENTS={fire:{name:"Огонь",color:"#ff4d4d",stat:"pushups",icon:"🔥"},air:{name:"Воздух",color:"#ffb703",stat:"pullups",icon:"💨"},water:{name:"Вода",color:"#00b0ff",stat:"squats",icon:"💧"},earth:{name:"Земля",color:"#00e676",stat:"steps",icon:"🌿"}};
const BOSS_NAMES={fire:["Огненный Демон","Пепельный Инквизитор","Магматический Титан","Саламандра Бездны","Архидемон Лавы","Инфернальный Владыка","Пожиратель Костров","Феникс Возрожденный","Голем Расплавленного Ядра","Повелитель Вулканов"],air:["Грифон","Сильф","Штормовой Орел","Джинн Ветров","Небесный Змей","Повелитель Ураганов","Элементаль Смерча","Ангел Бурь","Дух Стратосферы","Владыка Небес"],water:["Водяной Элементаль","Сирена","Кракен","Ледяной Голем","Морской Дракон","Левиафан","Повелитель Приливов","Дух Океана","Абиссальный Ужас","Царь Глубин"],earth:["Каменный Голем","Лесной Дух","Горный Тролль","Корень Древа","Земляной Червяк","Титан Почвы","Хранитель Рудника","Горгулья","Древень","Владыка Горы"]};
const BOSS_REQS={fire:[100,250,500,1000,2000,3500,5000,7500,10000,15000],air:[30,60,120,250,500,800,1200,1800,2500,3500],water:[200,500,1000,2000,3500,6000,10000,15000,25000,40000],earth:[10000,30000,60000,100000,150000,250000,400000,600000,800000,1000000]};
let BOSSES_DATA=[];Object.keys(ELEMENTS).forEach(elem=>{for(let i=1;i<=10;i++){BOSSES_DATA.push({id:`${elem}_${i}`,element:elem,level:i,name:BOSS_NAMES[elem][i-1],req:BOSS_REQS[elem][i-1],rewardShadows:100*i,defeated:false});}});
const SHOP_ITEMS=[{id:'nick_red',type:'nickname',name:'🔥 Красный Ник',price:300,color:'#ff4d4d'},{id:'nick_gold',type:'nickname',name:'👑 Золотой Ник',price:1500,color:'#ffb703'},{id:'bg_fire',type:'bg',name:'🔥 Огненный Фон',price:1000,cssClass:'profile-bg-fire'},{id:'bg_royal',type:'bg',name:'👑 Королевский Фон',price:3000,cssClass:'profile-bg-royal'},{id:'bg_void',type:'bg',name:'🌌 Фон Бездны',price:5000,cssClass:'profile-bg-void'},{id:'av_demon',type:'avatar',name:'👺 Аватар Демона',price:800,icon:'👺'},{id:'av_dragon',type:'avatar',name:'🐉 Аватар Дракона',price:1200,icon:'🐉'},{id:'av_samurai',type:'avatar',name:'⚔️ Аватар Самурая',price:2000,icon:'⚔️'}];
let player;
window.onload=function(){const saved=localStorage.getItem('levelup_save_v23');if(saved){player=JSON.parse(saved);checkDailyQuests();showMainApp();}else{initNewPlayer();document.getElementById('character-creation').classList.remove('hidden');document.getElementById('main-app').classList.add('hidden');document.getElementById('bottom-nav').classList.add('hidden');}};
function initNewPlayer(){player={name:"",level:1,xp:0,xpNeeded:100,stats:{pushups:0,pullups:0,squats:0,steps:0},shadows:0,bosses:JSON.parse(JSON.stringify(BOSSES_DATA)),quests:[],questSelected:false,lastQuestDate:"",inventory:[],activeNickColor:'#f0e6ff',activeBgClass:'',activeAvatar:'👤'};}
function createCharacter(){const nameInput=document.getElementById('player-name-input').value.trim();if(nameInput===""){alert("Введи имя!");return;}player.name=nameInput;checkDailyQuests();saveGame();showMainApp();}
function showMainApp(){document.getElementById('character-creation').classList.add('hidden');document.getElementById('main-app').classList.remove('hidden');document.getElementById('bottom-nav').classList.remove('hidden');updateUI();}
function switchScreen(screenName){document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));document.getElementById('screen-'+screenName).classList.add('active');document.getElementById('nav-'+screenName).classList.add('active');updateUI();}
function togglePath(elemId){document.getElementById(elemId).classList.toggle('active');}
function addStat(statName){const inputField=document.getElementById('input-'+statName);const amount=parseFloat(inputField.value);if(isNaN(amount)||amount<=0){alert("Введи число больше нуля!");return;}player.stats[statName]+=amount;let defeatedList=[];let totalShadows=0;player.bosses.forEach(boss=>{if(!boss.defeated&&ELEMENTS[boss.element].stat===statName){const prevBoss=player.bosses.find(b=>b.element===boss.element&&b.level===boss.level-1);if(boss.level>1&&prevBoss&&!prevBoss.defeated)return;if(player.stats[statName]>=boss.req){boss.defeated=true;player.shadows+=boss.rewardShadows;defeatedList.push(boss.name);totalShadows+=boss.rewardShadows;}}});if(defeatedList.length>0){let msg=`🏆 БОССЫ ПОБЕЖДЕНЫ!\n\n`;defeatedList.forEach(name=>msg+=`⚔️ ${name}\n`);msg+=`\n💰 Получено Теней: +${totalShadows} 🌑`;alert(msg);}player.xp+=amount*XP_RATES[statName];checkLevelUp();checkQuests(statName,amount);inputField.value="";saveGame();updateUI();}
function undoStat(statName){const inputField=document.getElementById('input-'+statName);const amount=parseFloat(inputField.value);if(isNaN(amount)||amount<=0){alert("Введи число!");return;}let actuallyRemoved=Math.min(player.stats[statName],amount);player.stats[statName]-=actuallyRemoved;let xpToRemove=actuallyRemoved*XP_RATES[statName];player.bosses.forEach(boss=>{if(boss.defeated&&ELEMENTS[boss.element].stat===statName){if(player.stats[statName]<boss.req){boss.defeated=false;player.shadows=Math.max(0,player.shadows-boss.rewardShadows);}}});let totalXpEarned=player.xp;for(let i=1;i<player.level;i++){let needed=0;if(i<=5)needed=100+(i*50);else if(i<=20)needed=500+((i-5)*200);else if(i<=50)needed=5000+((i-20)*800);else if(i<=80)needed=30000+((i-50)*1500);else needed=80000+((i-80)*2000);totalXpEarned+=needed;}totalXpEarned-=xpToRemove;if(totalXpEarned<0)totalXpEarned=0;let newLevel=1;let xpLeft=totalXpEarned;let xpNeededForLevel=100;while(xpLeft>=xpNeededForLevel){xpLeft-=xpNeededForLevel;newLevel++;if(newLevel<=5)xpNeededForLevel=100+(newLevel*50);else if(newLevel<=20)xpNeededForLevel=500+((newLevel-5)*200);else if(newLevel<=50)xpNeededForLevel=5000+((newLevel-20)*800);else if(newLevel<=80)xpNeededForLevel=30000+((newLevel-50)*1500);else xpNeededForLevel=80000+((newLevel-80)*2000);}if(newLevel<player.level)alert(`⚠️ УРОВЕНЬ ПОНИЖЕН!\nБыл: ${player.level} -> Стал: ${newLevel}`);player.level=newLevel;player.xp=xpLeft;player.xpNeeded=xpNeededForLevel;let totalSpent=0;player.inventory.forEach(itemId=>{const item=SHOP_ITEMS.find(i=>i.id===itemId);if(item)totalSpent+=item.price;});if(player.shadows<totalSpent){while(player.shadows<totalSpent&&player.inventory.length>0){let removedId=player.inventory.pop();let removedItem=SHOP_ITEMS.find(i=>i.id===removedId);if(removedItem){totalSpent-=removedItem.price;if(removedItem.type==='avatar'&&player.activeAvatar===removedItem.icon)player.activeAvatar='👤';if(removedItem.type==='bg'&&player.activeBgClass===removedItem.cssClass)player.activeBgClass='';if(removedItem.type==='nickname'&&player.activeNickColor===removedItem.color)player.activeNickColor='#f0e6ff';}}alert("⚠️ Внимание! Из-за нехватки Теней некоторые купленные предметы были изъяты.");}inputField.value="";saveGame();updateUI();}
function checkLevelUp(){let levelsGained=0;let oldRank=getRankByLevel(player.level);while(player.xp>=player.xpNeeded){player.xp-=player.xpNeeded;player.level++;if(player.level<=5)player.xpNeeded=100+(player.level*50);else if(player.level<=20)player.xpNeeded=500+((player.level-5)*200);else if(player.level<=50)player.xpNeeded=5000+((player.level-20)*800);else if(player.level<=80)player.xpNeeded=30000+((player.level-50)*1500);else player.xpNeeded=80000+((player.level-80)*2000);levelsGained++;}let newRank=getRankByLevel(player.level);if(levelsGained>0){let msg=`🎉 УРОВЕНЬ ПОВЫШЕН!\nТеперь твой уровень: ${player.level}`;if(newRank!==oldRank)msg+=`\n\n🔥 НОВЫЙ РАНГ: ${newRank}!`;alert(msg);}}
function getRankByLevel(lvl){if(lvl>=100)return"SSS";if(lvl>=80)return"SS";if(lvl>=60)return"S";if(lvl>=45)return"A";if(lvl>=30)return"B";if(lvl>=20)return"C";if(lvl>=10)return"D";if(lvl>=5)return"E";return"F";}
const QUEST_TITLES=["Зачистка логова Гоблинов","Погоня за Тенями","Тренировка в Бездне","Ритуал Очищения","Охота на Дракона","Сбор энергии","Испытание Огня","Прыжок в Небо","Битва с Иллюзией","Подготовка к Реваншу"];
function checkDailyQuests(){const today=new Date().toDateString();if(player.lastQuestDate!==today){player.questSelected=false;player.quests=[];player.lastQuestDate=today;saveGame();}}
function getBaseQuestReq(statName,lvl){if(lvl<=5)return statName==='pushups'?20:statName==='pullups'?5:statName==='squats'?30:2000;if(lvl<=15)return statName==='pushups'?50:statName==='pullups'?15:statName==='squats'?80:5000;if(lvl<=30)return statName==='pushups'?100:statName==='pullups'?25:statName==='squats'?150:8000;return statName==='pushups'?150:statName==='pullups'?40:statName==='squats'?250:12000;}
function selectQuest(statName){if(player.questSelected)return;let baseReq=getBaseQuestReq(statName,player.level);let target=Math.max(baseReq,Math.min(Math.floor(player.stats[statName]*0.2),baseReq*2));let reward=Math.max(50,Math.floor(target*0.5));let title=QUEST_TITLES[Math.floor(Math.random()*QUEST_TITLES.length)];player.quests=[{id:'q_'+statName,stat:statName,target:target,current:0,reward:reward,claimed:false,title:title}];player.questSelected=true;saveGame();updateUI();}
function checkQuests(statName,amount){let updated=false;player.quests.forEach(q=>{if(q.stat===statName&&!q.claimed&&q.current<q.target){q.current+=amount;if(q.current>q.target)q.current=q.target;updated=true;}});if(updated)saveGame();}
function claimQuest(questId){const q=player.quests.find(x=>x.id===questId);if(q&&q.current>=q.target&&!q.claimed){q.claimed=true;player.shadows+=q.reward;alert(`✅ Задание выполнено!\nТы получил ${q.reward} 🌑 Теней.`);saveGame();updateUI();}}
function buyItem(itemId){const item=SHOP_ITEMS.find(i=>i.id===itemId);if(!item||player.inventory.includes(itemId))return;if(player.shadows>=item.price){player.shadows-=item.price;player.inventory.push(itemId);if(item.type==='avatar')player.activeAvatar=item.icon;alert(`🛍️ Покупка успешна: ${item.name}!`);saveGame();updateUI();}else{alert("Недостаточно Теней!");}}
function equipItem(itemId){const item=SHOP_ITEMS.find(i=>i.id===itemId);if(!item)return;if(item.type==='nickname')player.activeNickColor=item.color;if(item.type==='bg')player.activeBgClass=item.cssClass;if(item.type==='avatar')player.activeAvatar=item.icon;saveGame();updateUI();}
function updateUI(){
document.getElementById('display-name').innerText=player.name;
document.getElementById('display-name').style.color=player.activeNickColor;
document.getElementById('avatar-display').innerText=player.activeAvatar;
document.getElementById('profile-header-block').className='profile-header '+(player.activeBgClass||'');
document.getElementById('display-level').innerText=player.level;
document.getElementById('display-xp-text').innerText=`${Math.floor(player.xp)} / ${player.xpNeeded} XP`;
document.getElementById('xp-bar-fill').style.width=((player.xp/player.xpNeeded)*100)+'%';
document.getElementById('stat-pushups').innerText=player.stats.pushups;
document.getElementById('stat-pullups').innerText=player.stats.pullups;
document.getElementById('stat-squats').innerText=player.stats.squats;
document.getElementById('stat-steps').innerText=player.stats.steps;
document.getElementById('display-shadows').innerText=player.shadows;
document.getElementById('shop-shadows').innerText=player.shadows;
let rank=getRankByLevel(player.level);let rankEl=document.getElementById('display-rank');rankEl.innerText=rank;rankEl.className='rank-badge';if(['F','E','D'].includes(rank))rankEl.classList.add('rank-f');else if(['C','B','A'].includes(rank))rankEl.classList.add('rank-c');else if(['S','SS'].includes(rank))rankEl.classList.add('rank-s');else rankEl.classList.add('rank-sss');
const bossPaths=document.getElementById('boss-paths');bossPaths.innerHTML="";
Object.keys(ELEMENTS).forEach(elemKey=>{const elem=ELEMENTS[elemKey];const defeatedCount=player.bosses.filter(b=>b.element===elemKey&&b.defeated).length;let bossesHtml="";player.bosses.filter(b=>b.element===elemKey).forEach(boss=>{const prevBoss=player.bosses.find(b=>b.element===elemKey&&b.level===boss.level-1);const isLocked=boss.level>1&&prevBoss&&!prevBoss.defeated;let statusClass=boss.defeated?'defeated':(isLocked?'locked':'');let lockIcon=isLocked?'🔒 ':'';let currentProg=Math.min(player.stats[elem.stat],boss.req);let progressText=boss.defeated?"Побежден":`${currentProg} / ${boss.req}`;bossesHtml+=`<div class="boss-card ${statusClass}" style="border-left-color:${elem.color}"><div class="boss-header"><div class="boss-name">${lockIcon}${boss.level}. ${boss.name}</div><div class="boss-reward">${boss.rewardShadows} 🌑</div></div><div class="boss-req">Нужно: ${boss.req} ${NAMES[elem.stat].toLowerCase()}</div><div class="boss-progress">Твой прогресс: ${progressText}</div></div>`;});bossPaths.innerHTML+=`<div class="path-group" style="border-color:${elem.color}40"><div class="path-header" onclick="togglePath('path-${elemKey}')" style="color:${elem.color}"><span>${elem.icon} Путь: ${elem.name} (${defeatedCount}/10)</span><span>▼</span></div><div class="path-content" id="path-${elemKey}">${bossesHtml}</div></div>`;});
const questContainer=document.getElementById('quest-container');questContainer.innerHTML="";
if(!player.questSelected){
let selectHtml=`<p style="font-size:13px;color:#b39ddb;margin-bottom:10px;">Выбери испытание на сегодня. Помни: выбрать можно только одно!</p><div class="quest-select">`;
['pushups','pullups','squats','steps'].forEach(stat=>{let baseReq=getBaseQuestReq(stat,player.level);let target=Math.max(baseReq,Math.min(Math.floor(player.stats[stat]*0.2),baseReq*2));selectHtml+=`<button class="quest-btn" onclick="selectQuest('${stat}')"><div style="font-size:20px;margin-bottom:5px;">${ELEMENTS[Object.keys(ELEMENTS).find(k=>ELEMENTS[k].stat===stat)].icon}</div>${NAMES[stat]}<br><span style="font-size:10px;color:#b39ddb;">Сделать: ${target}</span></button>`;});selectHtml+=`</div>`;questContainer.innerHTML=selectHtml;
}else{
player.quests.forEach(q=>{let isCompleted=q.current>=q.target;let btnText=q.claimed?"Получено":(isCompleted?"Забрать награду":`Прогресс: ${Math.floor(q.current)}/${q.target}`);let btnDisabled=q.claimed||!isCompleted?"disabled":"";let cardClass=q.claimed?"":(isCompleted?"completed":"");questContainer.innerHTML+=`<div class="quest-card ${cardClass}"><div class="quest-title">${q.title}</div><div class="quest-desc">Сделай ${q.target} раз: ${NAMES[q.stat]}</div><div class="quest-reward">Награда: ${q.reward} 🌑</div><button class="btn-claim" onclick="claimQuest('${q.id}')" ${btnDisabled}>${btnText}</button></div>`;});}
const shopList=document.getElementById('shop-list');shopList.innerHTML="";
SHOP_ITEMS.forEach(item=>{const isOwned=player.inventory.includes(item.id);const isEquipped=(item.type==='nickname'&&player.activeNickColor===item.color)||(item.type==='bg'&&player.activeBgClass===item.cssClass)||(item.type==='avatar'&&player.activeAvatar===item.icon);let btnHtml="";if(!isOwned){btnHtml=`<button class="btn-buy" onclick="buyItem('${item.id}')" ${player.shadows<item.price?'disabled':''}>Купить</button>`;}else if(isEquipped){btnHtml=`<button class="btn-buy owned" disabled>Надето</button>`;}else{btnHtml=`<button class="btn-buy" style="background:var(--accent);color:#1a1025;" onclick="equipItem('${item.id}')">Надеть</button>`;}shopList.innerHTML+=`<div class="shop-item"><div class="shop-item-info"><div class="shop-title">${item.name}</div><div class="shop-price">${item.price} 🌑</div></div>${btnHtml}</div>`;});}
function saveGame(){localStorage.setItem('levelup_save_v23',JSON.stringify(player));}
function resetGame(){
    if(confirm("⚠️ ВНИМАНИЕ! Это полностью удалит твой профиль. Начать заново?")) {
        // 1. Удаляем сейв
        localStorage.removeItem('levelup_save_v23');
        
        // 2. Сбрасываем все данные в оперативной памяти
        initNewPlayer();
        
        // 3. Прячем игру и показываем экран создания
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('bottom-nav').classList.add('hidden');
        document.getElementById('character-creation').classList.remove('hidden');
        document.getElementById('player-name-input').value = "";
        
        // 4. Очищаем интерфейс от старых данных
        document.getElementById('display-name').innerText = "";
        document.getElementById('display-level').innerText = "1";
        document.getElementById('display-xp-text').innerText = "0 / 100 XP";
        document.getElementById('xp-bar-fill').style.width = "0%";
        document.getElementById('display-shadows').innerText = "0";
        document.getElementById('display-rank').innerText = "F";
        document.getElementById('display-rank').className = "rank-badge rank-f";
        
        // 5. Принудительно перерисовываем экран
        updateUI();
    }
}
</script>
</body>
</html>
